<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Job Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        p {
            text-align: center;
            color: #666;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background-color: #2c3e50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <h1>🔍 Fake Job Posting Detector</h1>
    <p>Paste any job description below to check if it is genuine or fake</p>
    <form action="/predict" method="POST">
        <textarea name="job_text" 
                  placeholder="Paste job title, description, requirements here..."></textarea>
        <button type="submit">Analyze Job Posting</button>
    </form>
</body>
</html>
